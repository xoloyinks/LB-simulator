<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Load balancer simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-200 antialiased">
<main class="max-w-6xl mx-auto p-4 sm:p-6">
  <h1 class="text-2xl font-semibold tracking-tight">Load balancer simulator</h1>
  <p class="text-slate-500 dark:text-slate-400 mb-5 max-w-2xl">Live traffic is generated by the NestJS backend and streamed here. Pick an algorithm, add servers, or take one down and watch the balancer react.</p>

  <section class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
    <div class="rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3"><b id="sSent" class="block text-2xl font-semibold">0</b><span class="text-sm text-slate-500">Sent</span></div>
    <div class="rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3"><b id="sOk" class="block text-2xl font-semibold">0</b><span class="text-sm text-slate-500">Succeeded</span></div>
    <div class="rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3"><b id="sFail" class="block text-2xl font-semibold text-red-600 dark:text-red-400">0</b><span class="text-sm text-slate-500">Failed</span></div>
    <div class="rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3"><b id="sLat" class="block text-2xl font-semibold">0 ms</b><span class="text-sm text-slate-500">Avg latency</span></div>
  </section>

  <div class="grid lg:grid-cols-[1fr_300px] gap-4">
    <section class="rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3">
      <canvas id="cv" class="w-full block" aria-label="Requests flowing from clients through the load balancer to servers"></canvas>
      <div class="flex items-center gap-2 text-sm text-slate-500 mt-2"><span id="conn" class="inline-block w-2 h-2 rounded-full bg-amber-500"></span><span id="connText">Connecting…</span></div>
    </section>

    <aside class="space-y-4">
      <section class="rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 space-y-4">
        <div><label for="algo" class="font-semibold block mb-1">Algorithm</label>
          <select id="algo" class="w-full rounded border border-slate-300 dark:border-slate-700 bg-transparent p-2 dark:bg-slate-900"></select></div>
        <div><label for="rate" class="font-semibold block mb-1">Traffic: <span id="rv">12</span> requests/s</label>
          <input id="rate" type="range" min="0" max="100" value="12" class="w-full accent-blue-600"></div>
        <div class="flex gap-2 flex-wrap">
          <button id="burst" class="px-3 py-1.5 rounded border border-slate-300 dark:border-slate-700 hover:border-blue-500">Send burst</button>
          <button id="reset" class="px-3 py-1.5 rounded border border-slate-300 dark:border-slate-700 hover:border-blue-500">Reset stats</button>
        </div>
      </section>

      <form id="addForm" class="rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 space-y-3">
        <h2 class="font-semibold">Add a server</h2>
        <div><label for="fName" class="text-sm block mb-1">Name (optional)</label>
          <input id="fName" maxlength="24" class="w-full rounded border border-slate-300 dark:border-slate-700 bg-transparent p-2"></div>
        <div class="grid grid-cols-2 gap-2">
          <div><label for="fWeight" class="text-sm block mb-1">Weight (1–10)</label>
            <input id="fWeight" type="number" min="1" max="10" value="1" class="w-full rounded border border-slate-300 dark:border-slate-700 bg-transparent p-2"></div>
          <div><label for="fCap" class="text-sm block mb-1">Max connections</label>
            <input id="fCap" type="number" min="1" max="100" placeholder="weight × 4" class="w-full rounded border border-slate-300 dark:border-slate-700 bg-transparent p-2"></div>
        </div>
        <button class="w-full px-3 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white font-medium">Add server</button>
        <p id="formErr" class="text-sm text-red-600 dark:text-red-400 hidden"></p>
      </form>
    </aside>
  </div>

  <section class="mt-4 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="text-left text-slate-500"><tr><th class="p-3 font-medium">Server</th><th class="p-3 font-medium">Weight</th><th class="p-3 font-medium">Connections</th><th class="p-3 font-medium">Handled</th><th class="p-3 font-medium">Failed</th><th class="p-3 font-medium">Status</th><th class="p-3"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>

<script>
const LABELS={'round-robin':'Round robin','weighted-round-robin':'Weighted round robin','least-connections':'Least connections','ip-hash':'IP hash','random':'Random'};
// Same-origin when served by Nest (http://localhost:3000). Otherwise (file://, Live Server, another port) call the backend directly.
const BASE=new URLSearchParams(location.search).get('api')||(location.port==='3000'||(location.protocol.startsWith('http')&&location.port==='')?'':'http://localhost:3000');
const api=(m,p,b)=>fetch(BASE+'/api'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined})
  .then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw d;return d});
const $=id=>document.getElementById(id);
let state=null,particles=[],rowKey='';

// ---- live stream ----
const es=new EventSource(BASE+'/api/stream');
es.onopen=()=>{$('conn').className='inline-block w-2 h-2 rounded-full bg-emerald-500';$('connText').textContent='Live'};
es.onerror=()=>{$('conn').className='inline-block w-2 h-2 rounded-full bg-red-500';$('connText').textContent='Disconnected, retrying…'};
es.onmessage=e=>{
  state=JSON.parse(e.data);
  const t=performance.now();
  state.events.forEach(ev=>particles.push({...ev,t0:t}));
  render();
};
api('GET','/state').then(s=>{state=s;initControls();render()});

function initControls(){
  $('algo').innerHTML=state.algorithms.map(a=>`<option value="${a}">${LABELS[a]}</option>`).join('');
  $('algo').value=state.algorithm;$('rate').value=state.rate;$('rv').textContent=state.rate;
}
$('algo').onchange=e=>api('PUT','/config',{algorithm:e.target.value});
$('rate').oninput=e=>{$('rv').textContent=e.target.value;api('PUT','/config',{rate:+e.target.value})};
$('burst').onclick=()=>api('POST','/burst');
$('reset').onclick=()=>api('POST','/reset');
$('addForm').onsubmit=async e=>{
  e.preventDefault();$('formErr').classList.add('hidden');
  const body={weight:+$('fWeight').value||1};
  if($('fName').value.trim())body.name=$('fName').value.trim();
  if($('fCap').value)body.capacity=+$('fCap').value;
  try{await api('POST','/servers',body);$('fName').value='';$('fCap').value=''}
  catch(err){const m=[].concat(err.message||'Could not add server').join(', ');$('formErr').textContent=m;$('formErr').classList.remove('hidden')}
};
$('rows').onclick=e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;
  const id=b.dataset.id;
  if(b.dataset.act==='toggle')api('PATCH',`/servers/${id}/toggle`);
  if(b.dataset.act==='remove')api('DELETE',`/servers/${id}`);
};

function render(){
  const s=state.stats;
  $('sSent').textContent=s.sent;$('sOk').textContent=s.ok;$('sFail').textContent=s.failed;$('sLat').textContent=Math.round(s.avgLatencyMs)+' ms';
  if(document.activeElement!==$('algo'))$('algo').value=state.algorithm;
  // rebuild rows only when structure changes, so buttons stay clickable while counters tick
  const key=state.servers.map(v=>`${v.id}:${v.up}:${v.healthy}`).join();
  if(key!==rowKey){rowKey=key;
    $('rows').innerHTML=state.servers.map(v=>{
      const status=!v.up?(v.healthy?'Down, not yet detected':'Down, removed from pool'):'Healthy';
      const color=!v.up?'text-red-600 dark:text-red-400':'text-emerald-600 dark:text-emerald-400';
      return `<tr class="border-t border-slate-200 dark:border-slate-800"><td class="p-3 font-medium">${esc(v.name)}</td><td class="p-3">${v.weight}</td>
        <td class="p-3"><span data-a="${v.id}"></span> / ${v.capacity}</td><td class="p-3" data-h="${v.id}"></td><td class="p-3" data-f="${v.id}"></td>
        <td class="p-3 ${color}">${status}</td>
        <td class="p-3 text-right whitespace-nowrap"><button data-act="toggle" data-id="${v.id}" class="px-2 py-1 rounded border border-slate-300 dark:border-slate-700 hover:border-blue-500">${v.up?'Take down':'Bring up'}</button>
        <button data-act="remove" data-id="${v.id}" class="px-2 py-1 ml-1 rounded border border-slate-300 dark:border-slate-700 hover:border-red-500">Remove</button></td></tr>`}).join('');
  }
  state.servers.forEach(v=>{
    const q=a=>document.querySelector(`[data-${a}="${v.id}"]`);
    q('a').textContent=v.active;q('h').textContent=v.handled;q('f').textContent=v.failed;
  });
}
const esc=t=>t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---- canvas animation ----
const cv=$('cv'),cx=cv.getContext('2d'),W=720,ROW=86,DUR=900;
function draw(now){
  const n=state?state.servers.length:0,H=Math.max(340,24+n*ROW);
  const dpr=devicePixelRatio||1,w=cv.clientWidth,k=w/W;
  cv.style.height=(k*H)+'px';cv.width=w*dpr;cv.height=k*H*dpr;cx.setTransform(k*dpr,0,0,k*dpr,0,0);
  const dark=matchMedia('(prefers-color-scheme: dark)').matches;
  const C=dark?{ink:'#e3eaf0',mute:'#8a98a6',line:'#2d3a47',acc:'#6f93ff',ok:'#4cc38a',warn:'#e5b13a',bad:'#f2675e'}
              :{ink:'#1b2733',mute:'#5d6b78',line:'#cbd5e1',acc:'#2563eb',ok:'#16a34a',warn:'#d97706',bad:'#dc2626'};
  cx.font='13px system-ui,sans-serif';cx.textBaseline='middle';
  const mid=H/2,sy=i=>12+i*ROW;
  cx.fillStyle=C.mute;cx.fillText('Clients',16,14);
  for(let i=0;i<16;i++){cx.fillStyle=C.line;cx.beginPath();cx.arc(24,30+i*(H-60)/15,4,0,7);cx.fill()}
  box(205,mid-60,90,120,C.acc);cx.fillStyle=C.ink;cx.textAlign='center';cx.fillText('Load balancer',250,mid-8);
  cx.fillStyle=C.mute;cx.fillText(state?LABELS[state.algorithm]:'',250,mid+12,84);cx.textAlign='left';
  if(state)state.servers.forEach((v,i)=>{
    cx.strokeStyle=C.line;cx.lineWidth=1;cx.beginPath();cx.moveTo(295,mid);cx.lineTo(520,sy(i)+35);cx.stroke();
    const full=v.active>=v.capacity,c=!v.up?C.bad:full?C.warn:C.ok;
    box(520,sy(i),180,70,c,!v.up);
    cx.fillStyle=C.ink;cx.fillText(`${v.name} · weight ${v.weight}`,530,sy(i)+16,160);
    cx.fillStyle=C.mute;cx.fillText(!v.up?(v.healthy?'Down, not yet detected':'Down, removed'):`${v.active}/${v.capacity} connections`,530,sy(i)+34);
    cx.fillStyle=C.line;cx.fillRect(530,sy(i)+50,160,10);cx.fillStyle=c;cx.fillRect(530,sy(i)+50,160*Math.min(v.active/v.capacity,1),10);
  });
  particles=particles.filter(p=>now-p.t0<DUR);
  for(const p of particles){
    const a=(now-p.t0)/DUR,i=state?state.servers.findIndex(v=>v.id===p.serverId):-1;
    const cy=30+(p.clientId)*(H-60)/15,ty=i>=0?sy(i)+35:mid;
    let x,y,alpha=1;
    if(a<.5){const f=a/.5;x=28+177*f;y=cy+(mid-cy)*f}
    else{const f=(a-.5)/.5;x=i>=0?295+225*f:250;y=mid+(ty-mid)*f;if(p.outcome!=='accepted'&&f>.6)alpha=(1-f)/.4}
    cx.globalAlpha=Math.max(alpha,0);
    cx.fillStyle=p.outcome==='accepted'?C.acc:p.outcome==='overloaded'?C.warn:C.bad;
    cx.beginPath();cx.arc(x,y,4,0,7);cx.fill();cx.globalAlpha=1;
  }
  requestAnimationFrame(draw);
}
function box(x,y,w,h,c,dash){cx.strokeStyle=c;cx.lineWidth=2;cx.setLineDash(dash?[5,4]:[]);cx.beginPath();cx.roundRect(x,y,w,h,6);cx.stroke();cx.setLineDash([])}
requestAnimationFrame(draw);
</script>
</body></html>
